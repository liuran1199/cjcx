<h2>管理员功能范围</h2>
<p class="subtitle">管理员后台需要哪些能力？已根据讨论预选了核心功能。</p>

<div class="options" data-multiselect>
  <div class="option" data-choice="exam-mgmt" onclick="toggleSelect(this)">
    <div class="letter">1</div>
    <div class="content">
      <h3>考试管理</h3>
      <p>创建/编辑考试，设置考试名称、时间、是否启用身份证验证</p>
    </div>
  </div>
  <div class="option" data-choice="excel-import" onclick="toggleSelect(this)">
    <div class="letter">2</div>
    <div class="content">
      <h3>Excel导入成绩</h3>
      <p>上传 Excel → 预览确认列映射 → 导入成绩数据</p>
    </div>
  </div>
  <div class="option" data-choice="score-mgmt" onclick="toggleSelect(this)">
    <div class="letter">3</div>
    <div class="content">
      <h3>成绩数据管理</h3>
      <p>查看、修改、删除单条成绩记录，支持搜索和筛选</p>
    </div>
  </div>
  <div class="option" data-choice="student-mgmt" onclick="toggleSelect(this)">
    <div class="letter">4</div>
    <div class="content">
      <h3>学生信息库</h3>
      <p>维护学号→身份证号映射，用于身份证验证场景</p>
    </div>
  </div>
  <div class="option" data-choice="cas-config" onclick="toggleSelect(this)">
    <div class="letter">5</div>
    <div class="content">
      <h3>CAS认证配置</h3>
      <p>配置 CAS 地址、启用/禁用统一认证</p>
    </div>
  </div>
  <div class="option" data-choice="admin-accounts" onclick="toggleSelect(this)">
    <div class="letter">6</div>
    <div class="content">
      <h3>管理员账号管理</h3>
      <p>添加/删除管理员，设置权限</p>
    </div>
  </div>
  <div class="option" data-choice="query-logs" onclick="toggleSelect(this)">
    <div class="letter">7</div>
    <div class="content">
      <h3>查询日志</h3>
      <p>记录谁在什么时间查询了哪个考试的成绩</p>
    </div>
  </div>
</div>
